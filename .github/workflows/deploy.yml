name: Deploy Nexora-AI to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t nexora-ai:latest .

      - name: Deploy and Run Container
        run: |
          docker rm -f nexora-ai || true
          docker run -d \
            --name nexora-ai \
            --restart unless-stopped \
            --env-file /home/ubuntu/actions-runner/.env \
            -p 8000:8000 \
            nexora-ai:latest